<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ユーザー管理</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .user { margin-bottom: 8px; }
    .form { margin-top: 20px; }
  </style>
</head>
<body>

  <h1>ユーザー一覧</h1>
  <div id="users"></div>

  <h2>ユーザー追加</h2>
  <div class="form">
    <input id="name" placeholder="名前" />
    <input id="age" placeholder="年齢" type="number" />
    <button onclick="addUser()">追加</button>
  </div>

  <h3>ファイルアップロード</h3>
  <input type="file" id="fileInput" />
  <button id="uploadBtn">アップロード</button>

  <div id="result"></div>

  <script>
    // -------------------------
    // ユーザー一覧を取得して表示
    // -------------------------
    async function loadUsers() {
      const res = await fetch("/api/users");
      const users = await res.json();

      const container = document.getElementById("users");
      container.innerHTML = "";

      users.forEach(u => {
        const div = document.createElement("div");
        div.className = "user";
        div.textContent = `${u.Id}: ${u.Name} (${u.Age})`;
        container.appendChild(div);
      });
    }

    // -------------------------
    // ユーザー追加
    // -------------------------
    async function addUser() {
      const name = document.getElementById("name").value;
      const age = Number(document.getElementById("age").value);

      if (!name || !age) {
        alert("名前と年齢を入力してください");
        return;
      }

      await fetch("/api/users-post", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, age })
      });

      // 入力欄をクリア
      document.getElementById("name").value = "";
      document.getElementById("age").value = "";

  // ★ これがないと一覧が更新されない！
  await loadUsers();
    }
    
    // -------------------------
    // ファイルアップロード
    // -------------------------
document.getElementById("uploadBtn").addEventListener("click", async () => {
    const fileInput = document.getElementById("fileInput");
    if (!fileInput.files.length) {
        alert("ファイルを選択してください");
        return;
    }

    const file = fileInput.files[0];

    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch("/api/upload-image", {
        method: "POST",
        body: formData
    });

    const data = await res.json();

    // 画像を表示
    document.getElementById("result").innerHTML = `
        <p>アップロード成功！</p>
        <img src="${data.url}" style="max-width:300px;">
    `;
});
    // ページ読み込み時に一覧を表示
    loadUsers();
  </script>

</body>
</html>
